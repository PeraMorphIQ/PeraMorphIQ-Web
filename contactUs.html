<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Redirecting…</title>
    <link rel="canonical" href="https://peramorphiq.ce.pdn.ac.lk/contact.html" />
    <meta name="robots" content="noindex" />
    <meta http-equiv="refresh" content="0; url=./contact.html" />
    <script>
      // Preserve any query string (e.g. ?id=news1) across the redirect.
      location.replace("./contact.html".includes("?")
        ? "./contact.html"
        : "./contact.html" + location.search + location.hash);
    </script>
  </head>
  <body>
    <p>This page has moved. <a href="./contact.html">Continue to Contact</a>.</p>
  </body>
</html>
