<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="css/hero.css" rel="stylesheet" />
    <link href="css/general.css" rel="stylesheet" />
    <link href="css/query.css" rel="stylesheet" />
    <title>peramorphiq-People</title>
  </head>
  <body>
    <header class="subSection-header">
      <div class="container">
        <a href="./index.html#supervisors" class="back-link">← Back to People Section</a>
      </div>
    </header>

    <main>
      
      <section class="section-supervisors" id="supervisors" style="background-color:#fff">
        <div class="container">
          <h2 class="subheading">
            People
          </h2>
        </div>

        <!--supervisors-->
        <section class="contributors-group">
          <div class="container">
            <h3 class="inherheader">Supervisors</h3>
            <div class="main-contributors grid grid--5--cols" id="supervisors-container">
                   <!-- Superviors will be loaded dynamically -->
            </div>
          </div>
        </section>
      </section>

        <!---team members-->
        <section class="contributors-group team-member-card">
          <div class="container">
            <h3 class="inherheader">Team Members</h3>

            <div class="main-contributors grid grid--5--cols" id="team-container">
              <!-- Team members will be loaded dynamically -->
            </div>
          </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="subSection-footer">
      <div class="container">
        <p>Department of Computer Engineering - University of Peradeniya</p>
      </div>
    </footer>


    <script type="module" src="./js/neuroAPI.js"></script>
    <script type="module" src="./js/reveal.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', function(){
        try {
          window.NEURO_API.loadPeoples('#team-container','#supervisors-container')
        } catch (e) {
          console.error('Failed to initialize API loaders', e);
        }
      });
    </script>

  </body>
</html>
