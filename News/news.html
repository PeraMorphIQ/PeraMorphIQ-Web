<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://unpkg.com/ionicons@4.5.10-0/dist/css/ionicons.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="news.css" />
    <link rel="stylesheet" href="../css/general.css" />
    <title>peramorphiq-news</title>
  </head>
  <body>

    <header class="news-header">
      <div class="news-sub-header">
        <div class="back-the-page">
          <ion-icon name="arrow-round-back" class="back-arrow-icon"></ion-icon>
          <a href="../index.html#news" class="back-link">Back to News</a>
        </div>

        <h1 class="news-title">Loading .... </h1>
        <ul class="news-meta">
          <li>Author  : </li>
          <li> | </li>
          <li>Publish : </li>
        </ul>
      </div>
    </header>

    <!-- Main Content -->
    <main class="news-main container" style="background-color:#fff">
      <div class="news-image-container">
        <img src="" alt="news image" class="news-image" />
        <div class="news-thumbnails"></div>
      </div>

      <div class="news-content">
        <p>Loadding...</p>
      </div>
    </main>

    <!-- Share buttons (moved below main content) -->
    <div class="share-row" aria-label="Share this article">
      <span class="share-label">Share:</span>
      <div class="share-buttons">
        <button class="share-btn" data-network="facebook" aria-label="Share on Facebook" title="Share on Facebook">
          <ion-icon name="logo-facebook"></ion-icon>
        </button>
        <button class="share-btn" data-network="twitter" aria-label="Share on Twitter" title="Share on Twitter">
          <ion-icon name="logo-twitter"></ion-icon>
        </button>
        <button class="share-btn" data-network="linkedin" aria-label="Share on LinkedIn" title="Share on LinkedIn">
          <ion-icon name="logo-linkedin"></ion-icon>
        </button>
      </div>
    </div>


    <!-- Footer -->
    <footer class="news-footer">
      <div class="container">
        <p>Department of Computer Engineering - University of Peradeniya </p>
      </div>
    </footer>


    <script src="./news.js"></script>
    <script src="https://unpkg.com/ionicons@4.5.10-0/dist/ionicons.js"></script>

    <!-- Lightbox overlay -->
    <div class="lightbox" aria-hidden="true" id="lightbox">
      <button class="lightbox-close" aria-label="Close (Esc)">&times;</button>
      <button class="lightbox-prev" aria-label="Previous (Left)">&#10094;</button>
      <div class="lightbox-stage">
        <img src="" alt="" class="lightbox-image" />
        <p class="lightbox-caption"></p>
      </div>
      <button class="lightbox-next" aria-label="Next (Right)">&#10095;</button>
    </div>
    
  </body>
</html>
