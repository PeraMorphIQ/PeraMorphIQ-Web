<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Redirecting…</title>
    <link rel="canonical" href="https://peramorphiq.ce.pdn.ac.lk/news.html" />
    <meta name="robots" content="noindex" />
    <meta http-equiv="refresh" content="0; url=../article.html" />
    <script>
      // Preserve any query string (e.g. ?id=news1) across the redirect.
      location.replace("../article.html".includes("?")
        ? "../article.html"
        : "../article.html" + location.search + location.hash);
    </script>
  </head>
  <body>
    <p>This page has moved. <a href="../article.html">Continue to News</a>.</p>
  </body>
</html>
